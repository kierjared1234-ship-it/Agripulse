; PlatformIO Project Configuration File

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM3
monitor_port = COM3
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
    4-20ma/ModbusMaster
; Replace COM3 with the actual ESP32 COM port shown in Device Manager.
; Do not select a USB flash drive or any non-serial path.
